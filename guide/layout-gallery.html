<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Guide layout gallery</title><style>body{margin:24px;background:#101b25;color:#edf5f1;font:15px system-ui}h1{margin-bottom:8px}p{line-height:1.5}a{color:#a3e0ff}select{padding:10px;max-width:100%}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:18px;margin-top:20px}article{border:1px solid #446359;border-radius:12px;padding:14px;background:#192d2d}h2{font-size:16px;min-height:40px;margin:0}svg{width:100%;display:block}small{display:block;min-height:34px;color:#d0ded4}</style><h1>Guide layout gallery</h1><p>Browse the prepared arrangements before trying them. Yellow dots mark planned cushion contacts; the dashed line shows the initial aim. Open a practice sheet for exact physical setup measurements.</p><label>Category <select id="category"><option value="all">All lessons</option></select></label><p id="count"></p><main id="gallery"></main><script>
(async()=>{const data=await fetch('./topic-scenes.json?v=varied-lessons-v1').then(r=>r.json()),topics=Object.values(data.topics),NS='http://www.w3.org/2000/svg',colors=['white','#f3cc31','#4086e6','#e44343','#a56bcd','#f29135','#56ac6a','#b44b36','#111'];function node(tag,a={},text){const n=document.createElementNS(NS,tag);for(const[k,v]of Object.entries(a))n.setAttribute(k,v);if(text)n.textContent=text;return n}const select=document.querySelector('select');for(const category of new Set(topics.map(s=>s.category)))select.add(new Option(category,category));function render(){const list=topics.filter(s=>select.value==='all'||s.category===select.value);document.querySelector('#count').textContent=list.length+' layouts · 123 redesigned; 8 linked Get Started scenes and 10 coordinate-specific drills retained.';const host=document.querySelector('main');host.replaceChildren();for(const s of list){const card=document.createElement('article'),title=document.createElement('h2');title.textContent=s.title;card.append(title);const f=s.file.history?.length>1?s.file.history[0]:s.file.layout,X=x=>22+x/f.tableL*560,Y=y=>22+y/f.tableW*280,svg=node('svg',{viewBox:'0 0 604 324',role:'img','aria-label':s.title});svg.append(node('rect',{x:8,y:8,width:588,height:308,rx:12,fill:'#72533a'}),node('rect',{x:22,y:22,width:560,height:280,fill:'#17634c'}));for(const [i,p]of [[0,0],[.5,0],[1,0],[1,1],[.5,1],[0,1]].entries()){svg.append(node('circle',{cx:22+p[0]*560,cy:22+p[1]*280,r:10,fill:'#030708'}));svg.append(node('text',{x:22+p[0]*560,y:22+p[1]*280+4,fill:'#fff','text-anchor':'middle','font-size':11},String(i+1)))}const cb=f.balls.find(b=>b.id===0),aim=f.freeAim;if(cb&&aim)svg.append(node('line',{x1:X(cb.x),y1:Y(cb.y),x2:X(aim.x),y2:Y(aim.y),stroke:'#d7faff','stroke-width':2,'stroke-dasharray':'7 5'}));for(const b of f.balls){if(b.marker){svg.append(node('circle',{cx:X(b.x),cy:Y(b.y),r:Math.max(3,(b.markerDiameterIn||3)*.0254/f.tableL*280),fill:'none',stroke:b.markerType==='yellow'?'#ffe249':'white','stroke-width':2}));continue}const c=b.id?colors[(b.id>8?b.id-8:b.id)]:'white';svg.append(node('circle',{cx:X(b.x),cy:Y(b.y),r:7,fill:b.id>8?'white':c,stroke:'#15251c'}));if(b.id>8)svg.append(node('rect',{x:X(b.x)-6,y:Y(b.y)-3,width:12,height:6,fill:c}));if(b.id)svg.append(node('text',{x:X(b.x),y:Y(b.y)+3,fill:b.id===8?'white':'black','text-anchor':'middle','font-size':8,'font-weight':'bold'},String(b.id)))}card.append(svg);const text=document.createElement('small');text.textContent=s.railContacts?.length?s.railContacts.length+' rails: '+s.railContacts.map(h=>h.rail).join(' → ')+(s.pocketNumber?' · Pocket '+s.pocketNumber:''):s.pocketNumber?'Pocket '+s.pocketNumber:s.category==='start'?'Linked Get Started lesson':s.id.startsWith('drill-')?'Narrated coordinate drill':s.profile+' practice';card.append(text);const link=document.createElement('a');link.href='./practice.html?topic='+encodeURIComponent(s.id);link.textContent='Physical practice sheet';card.append(link);host.append(card)}}select.onchange=render;render()})().catch(e=>document.querySelector('#count').textContent=e.message);
</script></html>
