<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#10151c">
<title>Billiards Trainer — Choose your experience</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/icon-192.png">
<style>
*{box-sizing:border-box}html{color-scheme:dark}body{margin:0;min-height:100vh;min-height:100svh;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 35%,#24302e,#10151c 64%,#090c10);color:#eeeae2;font-family:system-ui,sans-serif}main{width:min(920px,100%);padding:clamp(20px,5vw,64px) 20px;text-align:center}h1{font-size:clamp(26px,4vw,44px);font-weight:500;letter-spacing:.03em;margin:0 0 12px}p{color:#bbbcb6;font-size:clamp(14px,2vw,18px);margin:0 0 clamp(28px,6vh,60px)}nav{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(10px,3vw,38px)}a{display:flex;align-items:center;flex-direction:column;gap:18px;padding:clamp(16px,3vw,32px) 6px 24px;border:1px solid #bca77d33;border-radius:24px;background:linear-gradient(145deg,#ffffff08,#ffffff02);color:inherit;text-decoration:none;touch-action:manipulation;transition:background .25s,transform .25s,border-color .25s}a:hover{background:#ffffff0d;border-color:#c5a88088;transform:translateY(-4px)}a:focus-visible{outline:3px solid #75d2be;outline-offset:5px}.art{width:clamp(70px,17vw,160px);height:clamp(70px,17vw,160px);display:grid;place-items:center;overflow:hidden;border-radius:50%;background:linear-gradient(145deg,#343b3e,#171c22);box-shadow:0 8px 28px #0005;border:1px solid #c5a88066}.art img{width:100%;height:100%;object-fit:contain}.art svg{width:82%;height:82%}.label{font-size:clamp(17px,2.5vw,24px);font-weight:500}@media(prefers-reduced-motion:reduce){a{transition:none}}
</style>
</head>
<body>
<main>
<h1>Billiards Trainer</h1>
<p>Choose your experience</p>
<nav aria-label="Choose your experience">
<a href="./?zen=1" aria-label="Open Zen"><span class="art" aria-hidden="true"><svg viewBox="0 0 64 64" aria-hidden="true"><defs><linearGradient id="zenLotusMetal" x1="0" y1="0" x2=".7" y2="1"><stop stop-color="#D4BB92"/><stop offset="1" stop-color="#8F7755"/></linearGradient></defs><g fill="url(#zenLotusMetal)" stroke="#C5A880" stroke-width=".6" stroke-linejoin="round"><path d="M31 51C16 50 6 41 5 29c13 1 23 8 26 22Z"/><path d="M33 51c15-1 25-10 26-22-13 1-23 8-26 22Z"/><path d="M31 49C18 44 12 32 17 18c11 5 16 17 14 31Z"/><path d="M33 49c13-5 19-17 14-31-11 5-16 17-14 31Z"/><path d="M32 48C22 38 22 23 32 10c10 13 10 28 0 38Z"/></g><path d="M12 49q20 15 40 0" fill="none" stroke="#A68D68" stroke-width="1"/></svg></span><span class="label">Zen</span></a>
<a href="./?train=1" aria-label="Open Trainer"><span class="art"><img src="./icons/trainer-original-execute-v2.svg" alt=""></span><span class="label">Trainer</span></a>
<a href="./play.html" aria-label="Open Play"><span class="art"><img src="./icons/play-experience-v1.webp" alt=""></span><span class="label">Play</span></a>
</nav>
</main>
<script>if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').then(reg=>reg.update()).catch(err=>console.warn('Service worker registration failed:',err)));</script>
</body>
</html>
