    <path d="M17 123v17m12-17v17m12-17v17m12-17v16m12-16v16m12-16v16m12-16v16" stroke="#29cedc" stroke-width="2" opacity=".8"/>
    <path d="m95 124 130 1v13l-130 1Z" fill="url(#stripe)"/>
    <path d="m225 125 365 5v4l-365 4Z" fill="#e2cc97" stroke="#fff0c4" stroke-width=".5"/>
    <path d="M230 127 585 131" stroke="#ffffdf" stroke-width="1" opacity=".8"/>
