    </radialGradient>
    <filter id="glow" x="-.5" y="-.5" width="2" height="2"><feGaussianBlur stdDeviation="5"/></filter>
  </defs>
  <path d="M8 127h590" stroke="#16dbf0" stroke-width="9" opacity=".5" filter="url(#glow)"/>
  <text x="8" y="104" fill="url(#word)" font-family="Arial,Helvetica,sans-serif" font-size="103" font-weight="800" font-style="italic" transform="scale(.88 1)">Shot Clock</text>
  <circle cx="552" cy="70" r="43" fill="#31e8f0" opacity=".45" filter="url(#glow)"/>
  <circle cx="552" cy="70" r="37" fill="url(#ball)"/>
  <ellipse cx="554" cy="59" rx="17" ry="20" fill="#183039" transform="rotate(-20 554 59)"/>
  <text x="553" y="70" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="800" font-size="29" fill="#f8f6bd" transform="rotate(-20 554 59)">8</text>
