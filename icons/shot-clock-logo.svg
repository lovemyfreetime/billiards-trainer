<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 150" role="img" aria-label="Shot Clock">
  <defs>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2=".25">
      <stop stop-color="#00ecff"/><stop offset=".52" stop-color="#aaf9ff"/><stop offset=".8" stop-color="#f7f9ff"/><stop offset="1" stop-color="#fff0c8"/>
    </linearGradient>
    <linearGradient id="stripe" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="620" y2="0">
      <stop stop-color="#00f2fe"/><stop offset=".45" stop-color="#63eafb"/><stop offset=".79" stop-color="#f2e9b7"/><stop offset="1" stop-color="#ffe6b1"/>
    </linearGradient>
    <radialGradient id="ball" cx=".31" cy=".22" r=".85">
