name: Verify training balls and slow motion
on:
  push:
    branches: [test/training-balls-20261113, test/playback-performance-20261113, test/features-options-20261113]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  trainer:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check physics and offline inventory
        run: |
          node tests/trainer-cue-follow.test.cjs
          node tests/trainer-3d-viewpoints.test.cjs
          node tests/short-cue-guide.test.cjs
          node tests/training-ball.test.cjs
          node tests/contact-overlap.test.cjs
          node tests/ball-placement.test.cjs
          python3 scripts/build-offline-assets.py --check
      - name: Install browser and video tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          npm ci --prefix local-host --ignore-scripts --no-audit --no-fund
          node local-host/node_modules/playwright/cli.js install --with-deps chromium
      - name: Verify controls and slow-motion exports
        env:
          NODE_PATH: ./local-host/node_modules
          FOLLOW_CAMERA_TEST: ${{ contains(github.event.head_commit.message, '[follow-camera]') && '1' || '' }}
          SPIN_LAB_RECORDING_SMOKE: ${{ contains(github.event.head_commit.message, '[recording-smoke]') && '1' || '' }}
          SPIN_LAB_UI_ONLY: ${{ contains(github.event.head_commit.message, '[ui-only]') && '1' || '' }}
        run: |
          export CHROMIUM_EXECUTABLE_PATH=$(node -p "require('playwright').chromium.executablePath()")
          node tests/features-options.browser.cjs
          node tests/trainer-spin-lab.browser.cjs
          if [ -z "$SPIN_LAB_UI_ONLY" ] && [ -z "$FOLLOW_CAMERA_TEST" ]; then
            node tests/trainer-shot-recorder.browser.cjs
            node tests/trainer-camera-recorder.browser.cjs
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: training-ball-verification
          path: test-results/spin-lab
