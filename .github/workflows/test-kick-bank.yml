name: Verify kick and bank solver
on:
  push:
    branches: [test/kick-bank-20261113]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  solver:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check route acceptance, physics and inventory
        run: |
          node tests/bank-kick-location.test.cjs
          node tests/bank-kick-selection.test.cjs
          node tests/bank-kick-candidates.test.cjs
          node tests/contact-overlap.test.cjs
          node tests/training-ball.test.cjs
          python3 scripts/build-offline-assets.py --check
      - name: Install browser
        run: |
          npm ci --prefix local-host --ignore-scripts --no-audit --no-fund
          node local-host/node_modules/playwright/cli.js install --with-deps chromium
      - name: Verify screenshot layouts, handoff, execution and regressions
        env:
          NODE_PATH: ./local-host/node_modules
        run: |
          export CHROMIUM_EXECUTABLE_PATH=$(node -p "require('playwright').chromium.executablePath()")
          node tests/bank-kick-screenshots.browser.cjs
          node tests/bank-kick-performance.browser.cjs
          node tests/bank-kick-practical.browser.cjs
          node tests/bank-kick-location.browser.cjs
          node tests/bank-kick-full-rack.browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kick-bank-verification
          path: test-results/kick-bank
