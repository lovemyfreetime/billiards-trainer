name: Android installed controller picker
on:
  push:
    branches: [test/dualshock4-controller-2026-11-14]
    paths: [.github/workflows/probe-controller-picker.yml, tests/android-controller-picker.py]
permissions:
  contents: read
  actions: read
jobs:
  picker:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 43600263087
          name: Android-compiled-APKs-runtime-incomplete
          path: packages
      - name: Install screenshot assertion tools
        run: |
          python3 -m venv /tmp/picker-image-tools
          /tmp/picker-image-tools/bin/pip install Pillow==11.3.0
          sudo apt-get update -qq
          sudo apt-get install -y tesseract-ocr
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test signed 1225 through the installed touchscreen UI
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          emulator-build: '15917651'
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swangle_indirect -no-snapshot -noaudio -no-boot-anim -camera-back emulated
          script: |
            adb install -r packages/trainer/release/app-trainer-release.apk
            /tmp/picker-image-tools/bin/python tests/android-controller-picker.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-picker-touch-results
          path: picker-results
