name: Validate signed Android narration APK

on:
  push:
    branches:
      - test/narration-microphone
      - test/narration-microphone-repair-20261108
      - test/narration-export-cadence-20261108
    paths:
      - 'android-wrapper/**'
      - 'trainer-video-narration.js'
      - '.github/workflows/test-narration-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android-wrapper/app/billiards-trainer-release.jks
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_VERSION_CODE: '1181'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Require permanent release-signing credentials
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
      - name: Check full offline inventory before packaging
        run: |
          python3 scripts/build-offline-assets.py
          python3 scripts/build-offline-assets.py --check
          node --test tests/offline-loading.test.cjs tests/background-update-session.test.cjs
      - name: Build signed Trainer and Installer APKs and instrumentation
        working-directory: android-wrapper
        run: gradle :app:assembleTrainerRelease :app:assembleInstallerRelease :app:assembleTrainerReleaseAndroidTest :app:assembleInstallerReleaseAndroidTest
      - name: Verify complete APK and pinned permanent signature
        run: |
          python3 scripts/verify-android-app.py android-wrapper/app/build/outputs/apk/trainer/release/app-trainer-release.apk android-wrapper/app/build/outputs/apk/installer/release/app-installer-release.apk
          expected=a7e01270b7c40cb939d745d391fd8ae34e89c7051c363c11e125ca1616b4d9c7
          for flavor in trainer installer; do
            apk="android-wrapper/app/build/outputs/apk/$flavor/release/app-$flavor-release.apk"
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$apk" > /tmp/narration-signer.txt
            actual=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' /tmp/narration-signer.txt)
            test "$actual" = "$expected"
            if test "$flavor" = trainer; then package=com.lovemyfreetime.billiardstrainer; else package=com.lovemyfreetime.billiardstrainer.installer; fi
            "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | head -1 | grep -F "name='$package'"
            "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | head -1 | grep -F "versionCode='$ANDROID_VERSION_CODE'"
          done
      - name: Enable KVM for offline Android runtime test
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run signed Android apps with internet blocked
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back emulated
          working-directory: android-wrapper
          script: |
            adb root
            adb wait-for-device
            for firewall in iptables ip6tables; do adb shell "$firewall -w 5 -I OUTPUT -p tcp --dport 80 -j REJECT"; adb shell "$firewall -w 5 -I OUTPUT -p tcp --dport 443 -j REJECT"; adb shell "$firewall -w 5 -I OUTPUT -p udp --dport 443 -j REJECT"; done
            adb shell cmd connectivity airplane-mode enable
            adb shell svc wifi disable
            adb shell svc data disable
            gradle :app:connectedTrainerReleaseAndroidTest :app:connectedInstallerReleaseAndroidTest
      - name: Preserve device test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: narration-android-test-results
          path: |
            android-wrapper/app/build/reports/androidTests/
            android-wrapper/app/build/outputs/androidTest-results/
      - name: Preserve signed test APKs
        uses: actions/upload-artifact@v4
        with:
          name: narration-validated-APKs
          path: android-wrapper/app/build/outputs/apk/*/release/*.apk
