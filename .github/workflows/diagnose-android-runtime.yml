name: Verify retained 1227 Installer offline runtime
on:
  push:
    branches: [test/dualshock4-controller-2026-11-14]
    paths: [.github/workflows/diagnose-android-runtime.yml]
permissions:
  contents: read
  actions: read
jobs:
  installer:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ANDROID_VERSION_CODE: '1227'
      ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android-wrapper/app/test-signing.jks
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 43646740492
          name: Android-compiled-APKs-runtime-incomplete
          path: packages
      - name: Build matching instrumentation only
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          cd android-wrapper
          gradle :app:assembleInstallerReleaseAndroidTest
          rm "$ANDROID_KEYSTORE_PATH"
      - name: Verify retained APK identity and prepare emulator
        run: |
          mkdir -p installer-results
          apk=packages/installer/release/app-installer-release.apk
          sha256sum "$apk" | tee installer-results/apk-sha256.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$apk" | tee installer-results/signature.txt
          grep -F a7e01270b7c40cb939d745d391fd8ae34e89c7051c363c11e125ca1616b4d9c7 installer-results/signature.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" > installer-results/package.txt
          grep -F "name='com.lovemyfreetime.billiardstrainer.installer'" installer-results/package.txt
          grep -F "versionCode='1227'" installer-results/package.txt
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test exact retained Installer offline
        uses: reactivecircus/android-emulator-runner@v2
        env:
          ANDROID_KEYSTORE_PASSWORD: ''
          ANDROID_KEY_ALIAS: ''
          ANDROID_KEY_PASSWORD: ''
        with:
          api-level: 35
          emulator-build: '15917651'
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swangle_indirect -no-snapshot -noaudio -no-boot-anim -camera-back emulated
          script: |
            adb root
            adb wait-for-device
            for firewall in iptables ip6tables; do adb shell "$firewall -w 5 -I OUTPUT -p tcp --dport 80 -j REJECT"; adb shell "$firewall -w 5 -I OUTPUT -p tcp --dport 443 -j REJECT"; adb shell "$firewall -w 5 -I OUTPUT -p udp --dport 443 -j REJECT"; done
            adb shell cmd connectivity airplane-mode enable
            adb shell svc wifi disable
            adb shell svc data disable
            adb install -r packages/installer/release/app-installer-release.apk
            adb install -r -t android-wrapper/app/build/outputs/apk/androidTest/installer/release/app-installer-release-androidTest.apk
            timeout 600 adb shell am instrument -w -e class com.lovemyfreetime.billiardstrainer.BundledAppTest#completeAppWithoutInternetAndLegacyCacheMigration com.lovemyfreetime.billiardstrainer.installer.test/androidx.test.runner.AndroidJUnitRunner | tee installer-results/instrumentation.txt
            grep -E 'OK ?\(1 test\)' installer-results/instrumentation.txt
      - name: Preserve results
        if: always()
        run: adb logcat -d > installer-results/logcat.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installer-1227-offline-probe
          path: installer-results
