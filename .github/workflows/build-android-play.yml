name: Build offline Android Play preview
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android-wrapper/**'
      - 'play*.js'
      - 'play*.html'
      - 'play*.css'
      - 'play-audio/**'
      - 'local-session.*'
      - 'local-host/player.*'
      - 'scripts/package-play.py'
      - '.github/workflows/build-android-play.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Check shared commands and tracking
        run: |
          python3 scripts/package-play.py --android
          node --test tests/play-input.test.cjs tests/play-controls.test.cjs tests/play-features.test.cjs tests/play-narration.test.cjs
      - name: Compile standalone Play preview
        working-directory: android-wrapper
        run: gradle :app:assemblePlayDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Billiards-Play-Android-Preview
          path: android-wrapper/app/build/outputs/apk/play/debug/app-play-debug.apk
