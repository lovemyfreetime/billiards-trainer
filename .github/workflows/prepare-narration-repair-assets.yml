name: Prepare narration repair offline manifests
on:
  push:
    branches:
      - test/narration-microphone-repair-20261108
    paths:
      - '.github/workflows/prepare-narration-repair-assets.yml'
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check narration source and regenerate all content inventories
        run: |
          node --check trainer-video-narration.js
          python3 scripts/build-offline-assets.py
          python3 scripts/build-offline-assets.py --check
      - name: Checkpoint only the generated inventory files on the test branch
        run: |
          git add offline-assets.json service-worker.js native-updates.json
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Regenerate offline and native inventories for microphone repair'
            git push origin HEAD:test/narration-microphone-repair-20261108
          fi
