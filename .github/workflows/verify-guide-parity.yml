name: Verify shared Guide release
on:
  workflow_call:
    inputs:
      full_suite:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      full_suite:
        description: Run the extended browser regression suite
        type: boolean
        default: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Regenerate offline app manifests for this source snapshot
        run: python3 scripts/build-offline-assets.py
      - name: Verify identical browser, Windows and Android Guide bundles
        run: |
          python3 scripts/verify-guide-release.py
          node tests/guide-practice-contract.test.cjs
          node tests/cue-deflection.test.cjs
      - name: Install browser checks
        run: |
          npm ci --prefix local-host --ignore-scripts --no-audit --no-fund
          node local-host/node_modules/playwright/cli.js install --with-deps chromium
      - name: Check the offline release and current Trainer controls
        env:
          NODE_PATH: ./local-host/node_modules
        run: |
          node --test tests/offline-loading.test.cjs tests/background-update-session.test.cjs tests/experience-entry.test.cjs
          node --test tests/trainer-3d-viewpoints.test.cjs tests/trainer-3d-gesture-routing.test.cjs tests/zen-fresh-table.test.cjs tests/trainer-lag-readout.test.cjs
          node --test tests/trainer-cue3d.test.cjs tests/trainer-cue-clearance.test.cjs tests/trainer-guidance.test.cjs tests/shot-geometry.test.cjs
          node tests/app-updates.browser.cjs
          node tests/pocket-feedback.browser.cjs
          node --test tests/trainer-shot-follow.test.cjs
          node tests/trainer-practice-workspace.browser.cjs
      - name: Check extended 3D gestures, ball tray and racks
        if: inputs.full_suite
        env:
          NODE_PATH: ./local-host/node_modules
        run: |
          node tests/trainer-3d-controls.browser.cjs
          node tests/trainer-3d-ball-tools.browser.cjs
          node tests/trainer-3d-edit.browser.cjs
          node tests/trainer-annotations.browser.cjs
          node tests/aim-zones.browser.cjs
      - name: Check extended desktop, tablet and phone behavior
        if: inputs.full_suite
        env:
          NODE_PATH: ./local-host/node_modules
        run: |
          node tests/native-content-updates.browser.cjs
          node tests/display-startup.browser.cjs
          node tests/installer-updates.browser.cjs
          node tests/cue-deflection.browser.cjs
          node tests/experience-narration.test.cjs
          node tests/experience-narration.browser.cjs
          node tests/chromebook-sliders.browser.cjs
          node tests/compact-guide-player.browser.cjs
          node tests/trainer-tools-menu.browser.cjs
          node tests/shared-session-history.browser.cjs
          node tests/layout-sharing.test.cjs
          node tests/photo-lighting.test.cjs
          node tests/photo-ball-evidence.test.cjs
          node tests/photo-ball-identity.test.cjs
          node tests/photo-detection-dedupe.test.cjs
          node tests/photo-corner-sensing.test.cjs
          node tests/photo-camera.browser.cjs
          node tests/trainer-sharing-controls.browser.cjs
          node tests/trainer-view-refinements.browser.cjs
          node tests/trainer-3d.browser.cjs
          node tests/bank-kick-selection.test.cjs
          node tests/bank-kick-candidates.test.cjs
          node tests/bank-kick-location.test.cjs
          node tests/bank-kick-contact.browser.cjs
          node tests/bank-kick-arrival.browser.cjs
          node tests/bank-kick-location.browser.cjs
          node tests/bank-kick-routing.browser.cjs
          node tests/bank-kick-practical.browser.cjs
          node tests/bank-kick-performance.browser.cjs
          node tests/bank-kick-full-rack.browser.cjs
          node tests/guide-platform-parity.browser.cjs
          node tests/guide-scenes.browser.cjs
          node tests/resources.browser.cjs
          node tests/lesson-sequence.browser.cjs
