name: Verify shared Guide release
on:
  workflow_call:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify identical browser, Windows and Android Guide bundles
        run: |
          python3 scripts/verify-guide-release.py
          node tests/guide-practice-contract.test.cjs
          node tests/cue-deflection.test.cjs
      - name: Install browser checks
        run: |
          npm ci --prefix local-host --ignore-scripts --no-audit --no-fund
          node local-host/node_modules/playwright/cli.js install --with-deps chromium
      - name: Check desktop, tablet and phone Guide behavior
        env:
          NODE_PATH: ./local-host/node_modules
        run: |
          node tests/native-content-updates.browser.cjs
          node tests/app-updates.browser.cjs
          node tests/display-startup.browser.cjs
          node tests/cue-deflection.browser.cjs
          node tests/chromebook-sliders.browser.cjs
          node tests/compact-guide-player.browser.cjs
          node tests/trainer-tools-menu.browser.cjs
          node tests/shared-session-history.browser.cjs
          node tests/trainer-3d-controls.browser.cjs
          node tests/trainer-3d.browser.cjs
          node tests/trainer-3d-edit.browser.cjs
          node tests/guide-platform-parity.browser.cjs
          node tests/guide-scenes.browser.cjs
          node tests/resources.browser.cjs
          node tests/lesson-sequence.browser.cjs
