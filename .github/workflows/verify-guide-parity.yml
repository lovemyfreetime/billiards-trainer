name: Verify shared Guide release
on:
  workflow_call:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify identical browser, Windows and Android Guide bundles
        run: python3 scripts/verify-guide-release.py
      - name: Install browser checks
        run: |
          npm ci --prefix local-host --ignore-scripts --no-audit --no-fund
          node local-host/node_modules/playwright/cli.js install --with-deps chromium
      - name: Check desktop, tablet and phone Guide behavior
        env:
          NODE_PATH: ./local-host/node_modules
        run: |
          node tests/guide-platform-parity.browser.cjs
          node tests/lesson-sequence.browser.cjs
