name: Verify intuitive table and next-ball guidance
on:
  push:
    branches: [feat/intuitive-guidance-20261118]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  intuitive-table:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Focused geometry, cue and inventories
        run: |
          node tests/trainer-guidance.test.cjs
          node tests/trainer-3d-gesture-routing.test.cjs
          node tests/trainer-cue3d.test.cjs
          node tests/trainer-cue-follow.test.cjs
          python3 scripts/build-offline-assets.py --check
      - name: Install browser
        run: |
          npm ci --prefix local-host --ignore-scripts --no-audit --no-fund
          node local-host/node_modules/playwright/cli.js install --with-deps chromium
      - name: Tablet interaction and actual shot handoff
        env:
          NODE_PATH: ./local-host/node_modules
        run: |
          export CHROMIUM_EXECUTABLE_PATH=$(node -p "require('playwright').chromium.executablePath()")
          node tests/intuitive-table.browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: intuitive-table-preview
          path: test-results/intuitive-table
