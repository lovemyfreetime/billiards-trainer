name: Build Android wrapper APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android-wrapper/**'
      - '.github/workflows/build-android-wrapper.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build debug APK
        working-directory: android-wrapper
        run: gradle :app:assembleDebug
      - name: Publish current Android installer
        run: |
          mkdir -p downloads
          cp android-wrapper/app/build/outputs/apk/debug/app-debug.apk downloads/Billiards-Trainer-Android.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f downloads/Billiards-Trainer-Android.apk
          if git diff --cached --quiet; then
            echo "Published APK is already current."
          else
            git commit -m "Publish current Android installer"
            git push
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: Billiards-Trainer-Android-Wrapper-debug
          path: android-wrapper/app/build/outputs/apk/debug/app-debug.apk
