name: Build Android wrapper APKs

on:
  workflow_dispatch:
  push:
    paths:
      - 'android-wrapper/**'
      - 'offline-assets.json'
      - 'scripts/package-android-app.py'
      - 'scripts/package-windows-app.py'
      - 'scripts/verify-android-app.py'
      - '.github/workflows/build-android-wrapper.yml'

concurrency:
  group: android-wrapper-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android-wrapper/app/billiards-trainer-release.jks
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Prepare signing for validation
        run: |
          if test -n "$ANDROID_KEYSTORE_BASE64" && test -n "$ANDROID_KEYSTORE_PASSWORD" && test -n "$ANDROID_KEY_ALIAS" && test -n "$ANDROID_KEY_PASSWORD"; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
            echo 'ANDROID_RELEASE_CONFIGURED=true' >> "$GITHUB_ENV"
          else
            echo '::notice::Release signing is not configured. Building with a disposable test key; public installers will remain unchanged.'
            keytool -genkeypair -keystore "$ANDROID_KEYSTORE_PATH" -storepass android-test-only -keypass android-test-only -alias instrumentation -dname 'CN=Disposable Android Test' -keyalg RSA -keysize 2048 -validity 2
            echo 'ANDROID_KEYSTORE_PASSWORD=android-test-only' >> "$GITHUB_ENV"
            echo 'ANDROID_KEY_PASSWORD=android-test-only' >> "$GITHUB_ENV"
            echo 'ANDROID_KEY_ALIAS=instrumentation' >> "$GITHUB_ENV"
            echo 'ANDROID_RELEASE_CONFIGURED=false' >> "$GITHUB_ENV"
          fi

      - name: Choose an increasing Android version
        run: |
          previous=$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging downloads/Billiards-Trainer-Android.apk | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p" | head -1)
          echo "ANDROID_VERSION_CODE=$((previous + ${{ github.run_number }} + 1))" >> "$GITHUB_ENV"

      - name: Verify complete app and shared behavior
        run: |
          python3 scripts/build-offline-assets.py --check
          node --test tests/offline-loading.test.cjs tests/background-update-session.test.cjs tests/experience-entry.test.cjs tests/play-narration.test.cjs tests/play-announcements.test.cjs

      - name: Build signed app and installer APKs
        working-directory: android-wrapper
        run: gradle :app:assembleTrainerRelease :app:assembleInstallerRelease :app:assembleTrainerReleaseAndroidTest :app:assembleInstallerReleaseAndroidTest

      - name: Verify packaged files and update compatibility
        run: |
          python3 scripts/verify-android-app.py android-wrapper/app/build/outputs/apk/trainer/release/app-trainer-release.apk android-wrapper/app/build/outputs/apk/installer/release/app-installer-release.apk
          signer="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$signer" verify --print-certs downloads/Billiards-Trainer-Android.apk > /tmp/previous-android-cert.txt
          "$signer" verify --print-certs android-wrapper/app/build/outputs/apk/trainer/release/app-trainer-release.apk > /tmp/current-android-cert.txt
          previous_cert=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' /tmp/previous-android-cert.txt)
          current_cert=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' /tmp/current-android-cert.txt)
          test -n "$previous_cert" && test -n "$current_cert"
          if test "$previous_cert" = "$current_cert"; then
            echo 'ANDROID_UPDATE_COMPATIBLE=true' >> "$GITHUB_ENV"
          else
            echo 'ANDROID_UPDATE_COMPATIBLE=false' >> "$GITHUB_ENV"
            echo '::notice::The build certificate differs from the existing Android download; publishing is blocked to protect in-place updates.'
          fi
          "$signer" verify --print-certs downloads/Billiards-Trainer-Installer-Android.apk > /tmp/previous-installer-cert.txt
          "$signer" verify --print-certs android-wrapper/app/build/outputs/apk/installer/release/app-installer-release.apk > /tmp/current-installer-cert.txt
          previous_installer_cert=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' /tmp/previous-installer-cert.txt)
          current_installer_cert=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' /tmp/current-installer-cert.txt)
          test -n "$previous_installer_cert" && test -n "$current_installer_cert"
          if test "$previous_installer_cert" = "$current_installer_cert"; then
            echo 'ANDROID_INSTALLER_COMPATIBLE=true' >> "$GITHUB_ENV"
          else
            echo 'ANDROID_INSTALLER_COMPATIBLE=false' >> "$GITHUB_ENV"
          fi
          aapt="$ANDROID_HOME/build-tools/35.0.0/aapt"
          previous=$("$aapt" dump badging downloads/Billiards-Trainer-Android.apk | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p" | head -1)
          current=$("$aapt" dump badging android-wrapper/app/build/outputs/apk/trainer/release/app-trainer-release.apk | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p" | head -1)
          test "$current" -gt "$previous"
          echo 'Version code increases; certificate compatibility is recorded separately.'

      - name: Enable KVM for the Android runtime test
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Test signed APKs on Android with internet blocked
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          working-directory: android-wrapper
          script: |
            adb root
            adb wait-for-device
            for firewall in iptables ip6tables; do adb shell "$firewall -w 5 -I OUTPUT -p tcp --dport 80 -j REJECT"; adb shell "$firewall -w 5 -I OUTPUT -p tcp --dport 443 -j REJECT"; adb shell "$firewall -w 5 -I OUTPUT -p udp --dport 443 -j REJECT"; done
            adb shell cmd connectivity airplane-mode enable
            adb shell svc wifi disable
            adb shell svc data disable
            gradle :app:connectedTrainerReleaseAndroidTest :app:connectedInstallerReleaseAndroidTest

      - name: Preserve Android test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Android-runtime-test-results
          path: |
            android-wrapper/app/build/reports/androidTests/
            android-wrapper/app/build/outputs/androidTest-results/

      - name: Preserve validated APKs for review
        uses: actions/upload-artifact@v4
        with:
          name: Android-validated-APKs
          path: android-wrapper/app/build/outputs/apk/*/release/*.apk

      - name: Require compatible release identity before publishing
        run: |
          test "$ANDROID_RELEASE_CONFIGURED" = true && test "$ANDROID_UPDATE_COMPATIBLE" = true || { echo 'APK build and runtime checks completed, but publication requires the signing key matching the installed Android app. Existing installer links and APKs are unchanged.'; exit 1; }

      - name: Publish signed Android installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p android-wrapper/output
          cp android-wrapper/app/build/outputs/apk/trainer/release/app-trainer-release.apk android-wrapper/output/Billiards-Trainer-Android.apk
          if test "$ANDROID_INSTALLER_COMPATIBLE" = true; then
            cp android-wrapper/app/build/outputs/apk/installer/release/app-installer-release.apk android-wrapper/output/Billiards-Trainer-Installer-Android.apk
          fi
          gh release view android-app --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create android-app --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title 'Billiards Trainer for Android' --notes-file android-wrapper/RELEASE_NOTES.md
          gh release upload android-app --repo "$GITHUB_REPOSITORY" android-wrapper/output/*.apk --clobber
          gh release edit android-app --repo "$GITHUB_REPOSITORY" --title 'Billiards Trainer for Android' --notes-file android-wrapper/RELEASE_NOTES.md
