name: Build Android wrapper APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android-wrapper/**'
      - '.github/workflows/build-android-wrapper.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build debug APK
        working-directory: android-wrapper
        run: gradle :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Billiards-Trainer-Android-Wrapper-debug
          path: android-wrapper/app/build/outputs/apk/debug/app-debug.apk
