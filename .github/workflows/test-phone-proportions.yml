name: Verify proportional phone layouts
on:
  push:
    branches: [test/proportional-phone-20261116]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  phone-proportions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check source and update inventories
        run: |
          node --check app-viewport.js
          node tests/shared-table-exchange.test.cjs
          node tests/play-shot-clock.test.cjs
          python3 scripts/build-offline-assets.py --check
      - name: Install browser
        run: |
          npm ci --prefix local-host --ignore-scripts --no-audit --no-fund
          node local-host/node_modules/playwright/cli.js install --with-deps chromium
      - name: Compare phone views with desktop proportions
        env:
          NODE_PATH: ./local-host/node_modules
        run: |
          export CHROMIUM_EXECUTABLE_PATH=$(node -p "require('playwright').chromium.executablePath()")
          node tests/phone-proportions.browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phone-proportions
          path: test-results/phone-proportions
