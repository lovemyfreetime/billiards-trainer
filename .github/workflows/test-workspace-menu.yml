name: Verify workspace menu refinements
on:
  push:
    branches: [test/workspace-menu-20261113]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check update inventory
        run: python3 scripts/build-offline-assets.py --check
      - name: Install browser
        run: |
          npm ci --prefix local-host --ignore-scripts --no-audit --no-fund
          node local-host/node_modules/playwright/cli.js install --with-deps chromium
      - name: Check menus, readouts and workspace at four sizes
        env:
          NODE_PATH: ./local-host/node_modules
        run: |
          export CHROMIUM_EXECUTABLE_PATH=$(node -p "require('playwright').chromium.executablePath()")
          node tests/trainer-workspace.browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workspace-menu-verification
          path: test-results/workspace
