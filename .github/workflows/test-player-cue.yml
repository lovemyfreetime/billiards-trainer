name: Verify realistic cue and Player View
on:
  push:
    branches: [test/player-cue-20261117]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  player:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify cue geometry, existing cameras and inventory
        run: |
          node --check trainer-cue3d.js
          node --check trainer-player-view.js
          node --check trainer-3d.js
          node tests/trainer-cue3d.test.cjs
          node tests/trainer-3d-viewpoints.test.cjs
          node tests/trainer-cue-follow.test.cjs
          python3 scripts/build-offline-assets.py --check
      - name: Install browser
        run: |
          npm ci --prefix local-host --ignore-scripts --no-audit --no-fund
          node local-host/node_modules/playwright/cli.js install --with-deps chromium
      - name: Verify finishes, Player View, live stroke and recording timeline
        env:
          NODE_PATH: ./local-host/node_modules
        run: |
          export CHROMIUM_EXECUTABLE_PATH=$(node -p "require('playwright').chromium.executablePath()")
          node tests/player-cue.browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: player-cue-verification
          path: test-results/player-cue
