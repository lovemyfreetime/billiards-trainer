name: Build Windows wrapper installer

on:
  workflow_dispatch:
  push:
    paths:
      - 'windows-wrapper/**'
      - 'index.html'
      - 'welcome.html'
      - 'zen-mode.js'
      - 'beta-*.js'
      - 'photo-*'
      - 'trainer-*'
      - 'guide/**'
      - 'vendor/**'
      - 'ai_model/**'
      - 'offline-assets.json'
      - 'native-updates.json'
      - 'scripts/build-native-updates.py'
      - 'tests/app-updates.browser.cjs'
      - 'tests/native-content-updates.browser.cjs'
      - 'tests/display-startup.browser.cjs'
      - 'tests/webview-assets/**'
      - 'scripts/package-windows-app.py'
      - 'scripts/build-offline-assets.py'
      - 'tests/offline-loading.test.cjs'
      - 'tests/windows-assets/**'
      - 'local-host/**'
      - 'local-session.*'
      - 'play-*.js'
      - 'play-*.css'
      - 'play-audio/**'
      - 'play-narration-copy.json'
      - 'play-announcements-copy.json'
      - 'experience-menu.*'
      - 'app-display.*'
      - 'icons/*'
      - 'play.html'
      - 'tournament*'
      - '.github/workflows/build-windows-wrapper.yml'
      - '.github/workflows/verify-guide-parity.yml'
      - 'scripts/verify-guide-release.py'
      - 'tests/guide-platform-parity.browser.cjs'

concurrency:
  group: windows-wrapper-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  guide-parity:
    uses: ./.github/workflows/verify-guide-parity.yml
  build:
    needs: guide-parity
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Preserve packaged file hashes on Windows
        shell: pwsh
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'

      - name: Verify local host
        shell: pwsh
        run: |
          npm ci --prefix local-host --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test local-host/test.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node local-host/node_modules/playwright/cli.js install chromium
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node local-host/browser.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify complete offline assets and bounded network behavior
        shell: pwsh
        run: |
          python scripts/build-offline-assets.py --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test tests/offline-loading.test.cjs tests/background-update-session.test.cjs tests/experience-entry.test.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project tests/windows-assets/AssetTests.csproj
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Create Windows icon
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force windows-wrapper/assets | Out-Null
          python -m pip install --disable-pip-version-check pillow
          @'
          from PIL import Image
          im = Image.open('icons/icon-512.png').convert('RGBA')
          im.save('windows-wrapper/assets/billiards-trainer.ico', sizes=[(16,16),(24,24),(32,32),(48,48),(64,64),(128,128),(256,256)])
          '@ | python -

      - name: Download Microsoft WebView2 bootstrapper
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile 'windows-wrapper/assets/MicrosoftEdgeWebview2Setup.exe'

      - name: Publish self-contained Windows wrapper
        shell: pwsh
        run: |
          dotnet restore windows-wrapper/BilliardsTrainer.Windows.csproj
          dotnet publish windows-wrapper/BilliardsTrainer.Windows.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -p:ApplicationIcon=assets/billiards-trainer.ico -o windows-wrapper/publish

      - name: Bundle offline local Play host
        shell: pwsh
        run: |
          npm prune --prefix local-host --omit=dev --ignore-scripts --no-audit --no-fund
          $destination = 'windows-wrapper/publish/local-play'
          New-Item -ItemType Directory -Force "$destination/local-host", "$destination/icons" | Out-Null
          Copy-Item (Get-Command node).Source "$destination/node.exe"
          $nodeLicense = Join-Path (Split-Path (Get-Command node).Source) 'LICENSE'
          if (Test-Path $nodeLicense) { Copy-Item $nodeLicense "$destination/NODE-LICENSE.txt" }
          Copy-Item app-display.js, app-display.css, manifest.webmanifest, tournament.html, tournament-engine.js, tournament-ui.js, tournament.css, play.html, play-input.js, play-training.js, play-controls.js, play-announcements.js, play-announcements-data.js, play-recorded-audio.js, play-narration.js, play-narration-data.js, play-calibration.js, play-calibration.html, play-mode.js, play-mode.css, play-engine.js, play-catalog.js, play-presentation.js, play-viewport.js, experience-menu.js, experience-menu.css, local-session.js, local-session.css $destination
          Copy-Item play-audio "$destination/play-audio" -Recurse
          Copy-Item local-host/audio-queue.cjs, local-host/server.cjs, local-host/player.html, local-host/player.js, local-host/player.css, local-host/package.json, local-host/package-lock.json, local-host/start.cjs "$destination/local-host"
          Copy-Item local-host/node_modules "$destination/local-host/node_modules" -Recurse
          Copy-Item icons/icon-192.png, icons/play-experience-v1.webp, icons/trainer-original-execute-v2.svg "$destination/icons"
          Copy-Item local-host/Start-Local-Play.cmd $destination
          Copy-Item local-host/README.md "$destination/README.md"
          Compress-Archive -Path "$destination/*" -DestinationPath 'windows-wrapper/output-local-play.zip' -Force

      - name: Bundle all experiences and test WebView2 without internet
        shell: pwsh
        run: |
          python scripts/package-windows-app.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $engine = Start-Process -FilePath 'windows-wrapper/assets/MicrosoftEdgeWebview2Setup.exe' -ArgumentList '/silent /install' -Wait -PassThru
          $smoke = Start-Process -FilePath 'windows-wrapper/publish/BilliardsTrainer.Windows.exe' -ArgumentList '--offline-smoke' -Wait -PassThru -RedirectStandardOutput 'windows-wrapper/offline-smoke.log' -RedirectStandardError 'windows-wrapper/offline-smoke-errors.log'
          Get-Content 'windows-wrapper/offline-smoke.log'
          Get-Content 'windows-wrapper/offline-smoke-errors.log'
          if ($smoke.ExitCode -ne 0) { exit $smoke.ExitCode }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build single EXE installer
        shell: pwsh
        run: |
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' 'windows-wrapper\installer.iss'

      - name: Publish complete offline Windows installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view windows-offline --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) {
            gh release create windows-offline --repo $env:GITHUB_REPOSITORY --target "${{ github.sha }}" --title 'Billiards Trainer for Windows' --notes-file windows-wrapper/RELEASE_NOTES.md
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          gh release upload windows-offline --repo $env:GITHUB_REPOSITORY 'windows-wrapper/output/Billiards-Trainer-Windows-Setup.exe' 'windows-wrapper/output-local-play.zip' --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release edit windows-offline --repo $env:GITHUB_REPOSITORY --title 'Billiards Trainer for Windows' --notes-file windows-wrapper/RELEASE_NOTES.md
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: Billiards-Trainer-Windows-Setup
          path: windows-wrapper/output/Billiards-Trainer-Windows-Setup.exe
