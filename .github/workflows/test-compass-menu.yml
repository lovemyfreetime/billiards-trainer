name: Verify compass gestures and matching menus
on:
  push:
    branches: [test/compass-menu-20261117]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  interface:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify source, review logic and complete inventory
        run: |
          node --check trainer-compass-controls.js
          node --check phone-play.js
          node tests/photo-number-labels.test.cjs
          node tests/photo-review-navigation.test.cjs
          node tests/photo-calibration-flow.test.cjs
          python3 scripts/build-offline-assets.py --check
      - name: Install browser
        run: |
          npm ci --prefix local-host --ignore-scripts --no-audit --no-fund
          node local-host/node_modules/playwright/cli.js install --with-deps chromium
      - name: Verify compass, headers and single-row analyzer
        env:
          NODE_PATH: ./local-host/node_modules
        run: |
          export CHROMIUM_EXECUTABLE_PATH=$(node -p "require('playwright').chromium.executablePath()")
          status=0
          node tests/compass-menu.browser.cjs || status=$?
          node tests/analyzer-layout.browser.cjs || status=$?
          exit "$status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compass-menu-verification
          path: |
            test-results/compass-menu
            test-results/analyzer-layout
