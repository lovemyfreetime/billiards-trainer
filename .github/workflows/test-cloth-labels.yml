name: Verify cloth label orientation
on:
  push:
    branches: [main, test/cloth-labels-20261117]
    paths:
      - 'index.html'
      - 'trainer-3d.js'
      - 'tests/view-learning-ui.browser.cjs'
      - '.github/workflows/test-cloth-labels.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cloth:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify source and update inventory
        run: |
          node --check trainer-3d.js
          node --check tests/view-learning-ui.browser.cjs
          python3 scripts/build-offline-assets.py --check
      - name: Install browser
        run: |
          npm ci --prefix local-host --ignore-scripts --no-audit --no-fund
          node local-host/node_modules/playwright/cli.js install --with-deps chromium
      - name: Verify original cloth positions, flat orientation and fixed size
        env:
          NODE_PATH: ./local-host/node_modules
          CLOTH_LABELS_ONLY: '1'
        run: |
          export CHROMIUM_EXECUTABLE_PATH=$(node -p "require('playwright').chromium.executablePath()")
          node tests/view-learning-ui.browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cloth-label-verification
          path: test-results/view-learning-ui
