name: Verify Explorer retirement and Jump placement
on:
  push:
    branches: [test/learning-cleanup-20261117]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  interface:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify source and complete inventory
        run: |
          node --check guide/guide.js
          node --check guide/pool-integration.js
          node --check guide/analyze-integration.js
          node --check guide/get-started-tour.js
          node --check guide/recorded-audio.js
          node tests/photo-number-labels.test.cjs
          python3 scripts/build-offline-assets.py --check
      - name: Install browser
        run: |
          npm ci --prefix local-host --ignore-scripts --no-audit --no-fund
          node local-host/node_modules/playwright/cli.js install --with-deps chromium
      - name: Verify learning access and Jump clearance
        env:
          NODE_PATH: ./local-host/node_modules
        run: |
          export CHROMIUM_EXECUTABLE_PATH=$(node -p "require('playwright').chromium.executablePath()")
          node tests/learning-cleanup.browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: learning-cleanup-verification
          path: test-results/learning-cleanup
