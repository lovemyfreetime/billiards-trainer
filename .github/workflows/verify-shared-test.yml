name: Verify remaining shared checks

on:
  workflow_dispatch:
  push:
    branches: [test/dualshock4-controller-2026-11-14]
    paths: [.github/workflows/verify-shared-test.yml]

permissions:
  contents: read

concurrency:
  group: remaining-shared-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Prepare current offline bundle and browser
        run: |
          python3 scripts/build-offline-assets.py
          python3 scripts/verify-guide-release.py
          npm ci --prefix local-host --ignore-scripts --no-audit --no-fund
          node local-host/node_modules/playwright/cli.js install --with-deps chromium
          mkdir -p test-results/shared-checks
      - name: '01/40 trainer-3d-ball-tools.browser'
        if: ${{ !cancelled() }}
        env:
          NODE_PATH: ./local-host/node_modules
        run: |
          set +e
          timeout --kill-after=10s 180s node tests/trainer-3d-ball-tools.browser.cjs 2>&1 | tee test-results/shared-checks/01-trainer-3d-ball-tools.browser.log
          result=${PIPESTATUS[0]}
          printf '%s\n' "$result" > test-results/shared-checks/01-trainer-3d-ball-tools.browser.exit-code.txt
          exit "$result"
      - name: '02/40 trainer-3d-edit.browser'
