name: Verify ball states and standalone clock
on:
  workflow_dispatch:
  push:
    branches: ['test/ball-controls-*']
permissions:
  contents: read
jobs:
  controls:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check controls, rules and asset inventory
        run: |
          node --check trainer-3d.js
          node --check play-mode.js
          node --check play-shot-clock-ui.js
          node tests/trainer-guidance.test.cjs
          node tests/trainer-3d-gesture-routing.test.cjs
          python scripts/package-play.py --android
          node --test tests/play-controls.test.cjs tests/play-input.test.cjs tests/play-features.test.cjs tests/play-narration.test.cjs tests/play-shot-clock.test.cjs
          python scripts/build-offline-assets.py --check
      - name: Install browser dependencies
        run: |
          npm ci --prefix local-host --ignore-scripts --no-audit --no-fund
          node local-host/node_modules/playwright/cli.js install --with-deps chromium
      - name: Verify colors, switching, saved state and standalone clock
        env:
          NODE_PATH: ${{ github.workspace }}/local-host/node_modules
          PLAY_REVIEW_DIR: test-results/ball-controls/play
        run: |
          status=0
          node tests/ball-control-states.browser.cjs || status=$?
          node tests/standalone-shot-clock.browser.cjs || status=$?
          node tests/shot-clock-controls.browser.cjs || status=$?
          node tests/play-viewport.browser.cjs || status=$?
          exit "$status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ball-controls-and-clock-review
          path: test-results/ball-controls
          if-no-files-found: ignore
