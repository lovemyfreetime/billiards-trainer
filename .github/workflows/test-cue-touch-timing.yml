name: Measure touch aiming and camera rendering
on:
  push:
    branches: [test/cue-touch-timing-20261118]
permissions:
  contents: read
jobs:
  timing:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          path: candidate
      - uses: actions/checkout@v4
        with:
          ref: d47a90a5f5d8abb1e71bd3bfc431337eebc5a3ab
          path: baseline
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: |
          npm ci --prefix candidate/local-host --ignore-scripts --no-audit --no-fund
          node candidate/local-host/node_modules/playwright/cli.js install --with-deps chromium
      - name: Check full-table framing from both sides on desktop and touch
        working-directory: candidate
        run: NODE_PATH="$PWD/local-host/node_modules" node tests/cue-clearance.browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-view-browser-evidence
          path: candidate/test-results/cue-clearance/*-full-*.png
      - name: Compare real touch input and 3D render completion
        run: NODE_PATH="$PWD/candidate/local-host/node_modules" node candidate/tests/cue-touch-timing.browser.cjs
