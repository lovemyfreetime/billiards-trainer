name: Verify brighter ghost balls
on:
  push:
    branches: [test/ghost-visibility-20261117]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  visibility:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify source and inventory
        run: |
          node --check trainer-3d.js
          python3 scripts/build-offline-assets.py --check
      - name: Install browser
        run: |
          npm ci --prefix local-host --ignore-scripts --no-audit --no-fund
          node local-host/node_modules/playwright/cli.js install --with-deps chromium
      - name: Check ghost visibility and existing guide behavior
        env:
          NODE_PATH: ./local-host/node_modules
        run: |
          export CHROMIUM_EXECUTABLE_PATH=$(node -p "require('playwright').chromium.executablePath()")
          node tests/ghost-fraction.browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ghost-visibility-verification
          path: test-results/ghost-fraction
