name: Verify organized Trainer menus
on:
  push:
    branches: [test/task-menu-20261116]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  task-menu:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check existing state behavior and complete update inventory
        run: |
          node tests/shot-redo.test.cjs
          node tests/phone-play.test.cjs
          node tests/trainer-3d-gesture-routing.test.cjs
          node tests/zen-tray-and-pockets.test.cjs
          python3 scripts/build-offline-assets.py --check
      - name: Install browser
        run: |
          npm ci --prefix local-host --ignore-scripts --no-audit --no-fund
          node local-host/node_modules/playwright/cli.js install --with-deps chromium
      - name: Verify menu task flows and direct workspace controls
        env:
          NODE_PATH: ./local-host/node_modules
        run: |
          export CHROMIUM_EXECUTABLE_PATH=$(node -p "require('playwright').chromium.executablePath()")
          status=0
          node tests/trainer-task-menu.browser.cjs || status=$?
          node tests/trainer-workspace.browser.cjs || status=$?
          exit "$status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: task-menu-verification
          path: |
            test-results/task-menu
            test-results/workspace
