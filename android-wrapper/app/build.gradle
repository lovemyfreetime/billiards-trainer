plugins {
    id 'com.android.application'
}

def releaseKeystorePath = System.getenv('ANDROID_KEYSTORE_PATH')
def releaseKeystorePassword = System.getenv('ANDROID_KEYSTORE_PASSWORD')
def releaseKeyAlias = System.getenv('ANDROID_KEY_ALIAS')
def releaseKeyPassword = System.getenv('ANDROID_KEY_PASSWORD')
def wrapperVersionCode = (System.getenv('ANDROID_VERSION_CODE') ?: '2').toInteger()

android {
    namespace 'com.lovemyfreetime.billiardstrainer'
    compileSdk 35

    defaultConfig {
        applicationId 'com.lovemyfreetime.billiardstrainer'
        minSdk 29
        targetSdk 35
        versionCode wrapperVersionCode
        versionName "4.12.${wrapperVersionCode}"
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        buildConfigField 'boolean', 'BUNDLED_APP', 'false'
        manifestPlaceholders = [appLabel: 'Billiards Trainer 4.12']
    }

    buildFeatures {
        buildConfig true
    }

    flavorDimensions += 'target'
    productFlavors {
        play {
            dimension 'target'
            applicationIdSuffix '.play'
            buildConfigField 'String', 'APP_URL', '"http://127.0.0.1:8788/play.html"'
            manifestPlaceholders = [appLabel: 'Billiards Play Preview']
        }
        trainer {
            buildConfigField 'boolean', 'BUNDLED_APP', 'true'
            dimension 'target'
            buildConfigField 'String', 'APP_URL', '"https://lovemyfreetime.github.io/billiards-trainer/"'
            manifestPlaceholders = [appLabel: 'Billiards Trainer 4.12']
        }
        installer {
            buildConfigField 'boolean', 'BUNDLED_APP', 'true'
            dimension 'target'
            applicationIdSuffix '.installer'
            buildConfigField 'String', 'APP_URL', '"https://lovemyfreetime.github.io/billiards-trainer/install/"'
            manifestPlaceholders = [appLabel: 'Billiards Trainer Installer']
        }
    }

    sourceSets {
        play.assets.srcDirs += ['build/generated/playAssets']
        trainer.assets.srcDirs += ['build/generated/appAssets']
        installer.assets.srcDirs += ['build/generated/appAssets']
    }
    androidResources { noCompress += ['mp3','onnx','bin','wasm'] }
    testBuildType 'release'

    signingConfigs {
        release {
            if (releaseKeystorePath) {
                storeFile file(releaseKeystorePath)
                storePassword releaseKeystorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    playImplementation 'org.nanohttpd:nanohttpd:2.3.1'
    playImplementation 'com.google.zxing:core:3.5.3'
}
tasks.register('bundlePlayAssets', Exec) {
    workingDir rootProject.projectDir.parentFile
    commandLine 'python3', 'scripts/package-play.py', '--android'
}
tasks.configureEach { if (name.startsWith('mergePlay') && name.endsWith('Assets')) dependsOn 'bundlePlayAssets' }

tasks.register('bundleAppAssets', Exec) {
    workingDir rootProject.projectDir.parentFile
    commandLine 'python3', 'scripts/package-android-app.py'
}
tasks.configureEach {
    if ((name.startsWith('mergeTrainer') || name.startsWith('mergeInstaller')) && name.endsWith('Assets')) dependsOn 'bundleAppAssets'
}
