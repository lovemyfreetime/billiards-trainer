plugins {
    id 'com.android.application'
}

android {
    namespace 'com.lovemyfreetime.billiardstrainer'
    compileSdk 35

    defaultConfig {
        applicationId 'com.lovemyfreetime.billiardstrainer'
        minSdk 29
        targetSdk 35
        versionCode 1
        versionName '4.12-wrapper-1'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
